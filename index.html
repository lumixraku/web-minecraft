<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Voxel Mountains & Lakes</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #a4d5f3; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #app { width: 100vw; height: 100vh; display: block; }
    #hud {
      position: fixed; top: 12px; left: 12px;
      color: #fff; background: rgba(0,0,0,0.35);
      padding: 8px 12px; border-radius: 6px;
      font-size: 12px; line-height: 1.6;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    #hud b { font-weight: 600; }
    #controls {
      position: fixed; top: 12px; right: 12px;
      display: flex; gap: 6px; flex-wrap: wrap;
      max-width: 280px; justify-content: flex-end;
    }
    #controls button {
      background: rgba(0,0,0,0.45);
      color: #fff; border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 10px; border-radius: 4px;
      font-size: 12px; cursor: pointer;
      backdrop-filter: blur(4px);
    }
    #controls button:hover { background: rgba(0,0,0,0.65); }
    #loading {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: linear-gradient(180deg, #4ea3e8 0%, #a4d5f3 60%, #eaf3fb 100%);
      color: #fff; font-size: 18px; z-index: 10;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/dist/esm/simplex-noise.js"
    }
  }
  </script>
</head>
<body>
  <div id="loading">Generating terrain…</div>
  <canvas id="app"></canvas>
  <div id="hud">
    <b>Voxel Mountains & Lakes</b><br/>
    Drag to rotate · Scroll to zoom · Right-drag to pan
  </div>
  <div id="controls">
    <button id="regen">Regenerate</button>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

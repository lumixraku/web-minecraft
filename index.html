<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Voxel World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --mc-stone-mid: #707070;
      --mc-stone-hi:  #9d9d9d;
      --mc-stone-lo:  #383838;
      --mc-stone-edge:#1a1a1a;
      --mc-yellow:    #ffff55;
      --mc-yellow-sh: #3f3f00;
      --mc-text-sh:   #3f3f3f;
    }

    html, body {
      margin: 0; padding: 0; overflow: hidden;
      background: #79553a;
      font-family: 'Press Start 2P', ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #fff;
      -webkit-font-smoothing: none;
      font-smooth: never;
      image-rendering: pixelated;
    }
    #app { width: 100vw; height: 100vh; display: block; image-rendering: auto; }

    /* In-game HUD — hidden while menu is open */
    #hud {
      position: fixed; bottom: 12px; left: 12px;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px; line-height: 1.8;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
    }
    body.menu-open #hud { display: none; }

    /* Loading splash */
    #loading {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: linear-gradient(180deg, #4ea3e8 0%, #a4d5f3 60%, #eaf3fb 100%);
      color: #fff; z-index: 300;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 #000;
    }

    /* ---------- Menu ---------- */
    #menu {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      /* Tiled dirt background (inline SVG, pixel-art rendered) */
      background-color: #6b4727;
      background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23866043'/%3E%3Crect x='1' y='0' width='1' height='1' fill='%236b4727'/%3E%3Crect x='3' y='0' width='1' height='1' fill='%239a7045'/%3E%3Crect x='6' y='0' width='1' height='1' fill='%235c3e1e'/%3E%3Crect x='0' y='2' width='1' height='1' fill='%239a7045'/%3E%3Crect x='4' y='2' width='1' height='1' fill='%236b4727'/%3E%3Crect x='7' y='2' width='1' height='1' fill='%23b58658'/%3E%3Crect x='2' y='3' width='1' height='1' fill='%23b58658'/%3E%3Crect x='5' y='3' width='1' height='1' fill='%235c3e1e'/%3E%3Crect x='0' y='4' width='1' height='1' fill='%236b4727'/%3E%3Crect x='3' y='5' width='1' height='1' fill='%239a7045'/%3E%3Crect x='6' y='5' width='1' height='1' fill='%23b58658'/%3E%3Crect x='1' y='6' width='1' height='1' fill='%239a7045'/%3E%3Crect x='4' y='7' width='1' height='1' fill='%236b4727'/%3E%3Crect x='7' y='7' width='1' height='1' fill='%239a7045'/%3E%3C/svg%3E");
      background-size: 64px 64px;
      background-repeat: repeat;
      image-rendering: pixelated;
    }
    #menu::before {
      /* Darken the dirt so text/buttons read clearly */
      content: '';
      position: absolute; inset: 0;
      background: rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }
    #menu.hidden { display: none; }

    .menu-content {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* ---------- Logo + splash ---------- */
    .logo-wrap {
      position: relative;
      margin-bottom: 56px;
      text-align: center;
    }
    .logo {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(28px, 6.5vw, 64px);
      color: #6cc44b;             /* grass green title */
      letter-spacing: 6px;
      margin: 0; padding: 0;
      line-height: 1;
      /* 3D extruded — multi-layer shadow */
      text-shadow:
        4px 4px 0 #2c5520,
        8px 8px 0 #1a3414,
        10px 10px 0 #000,
        12px 12px 30px rgba(0, 0, 0, 0.6);
    }
    .logo-sub {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(8px, 1.2vw, 12px);
      color: #fff;
      letter-spacing: 3px;
      margin-top: 16px;
      text-shadow: 2px 2px 0 var(--mc-text-sh);
      opacity: 0.85;
    }

    /* Yellow tilted bouncy splash text */
    .splash {
      position: absolute;
      right: 4%;
      top: 28%;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(11px, 1.3vw, 16px);
      color: var(--mc-yellow);
      text-shadow: 3px 3px 0 var(--mc-yellow-sh);
      transform: rotate(-18deg) translateZ(0);
      transform-origin: center;
      animation: splash-pulse 1.1s ease-in-out infinite;
      white-space: nowrap;
      pointer-events: none;
    }
    @keyframes splash-pulse {
      0%, 100% { transform: rotate(-18deg) scale(1); }
      50%      { transform: rotate(-18deg) scale(1.12); }
    }

    /* ---------- Stone buttons ---------- */
    .menu-buttons {
      display: flex; flex-direction: column;
      gap: 8px;
      width: clamp(280px, 36vw, 420px);
    }
    .mc-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      letter-spacing: 1px;
      padding: 16px 20px;
      color: #fff;
      text-shadow: 2px 2px 0 var(--mc-text-sh);
      background: var(--mc-stone-mid);
      border: none;
      outline: 2px solid var(--mc-stone-edge);
      box-shadow:
        inset 2px 2px 0 var(--mc-stone-hi),
        inset -2px -2px 0 var(--mc-stone-lo);
      cursor: pointer;
      transition: background 0.08s, color 0.08s;
      image-rendering: pixelated;
    }
    .mc-btn:hover:not(:disabled) {
      background: #8a8a8a;
      color: var(--mc-yellow);
      text-shadow: 2px 2px 0 var(--mc-yellow-sh);
      outline-color: #ffffff;
    }
    .mc-btn:active:not(:disabled) {
      box-shadow:
        inset -2px -2px 0 var(--mc-stone-hi),
        inset 2px 2px 0 var(--mc-stone-lo);
    }
    .mc-btn:disabled {
      color: #a0a0a0;
      background: #5a5a5a;
      cursor: not-allowed;
    }
    .mc-btn:focus { outline-color: #ffffff; }

    /* ---------- Footer corners ---------- */
    .menu-footer {
      position: absolute;
      bottom: 12px; z-index: 1;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px; letter-spacing: 1px;
      color: #fff;
      text-shadow: 2px 2px 0 #000;
      opacity: 0.85;
    }
    .menu-footer.left  { left: 12px; }
    .menu-footer.right { right: 12px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/dist/esm/simplex-noise.js"
    }
  }
  </script>
</head>
<body class="menu-open">
  <canvas id="app"></canvas>

  <div id="hud">
    Drag · Scroll · Right-drag &nbsp;|&nbsp; ESC for menu
  </div>

  <div id="loading">GENERATING TERRAIN…</div>

  <div id="menu">
    <div class="menu-content">
      <div class="logo-wrap">
        <h1 class="logo">VOXEL WORLD</h1>
        <div class="logo-sub">Procedural Mountains &amp; Lakes</div>
        <div class="splash" data-role="splash">Now with mountains!</div>
      </div>
      <div class="menu-buttons">
        <button class="mc-btn" data-action="continue">Continue</button>
        <button class="mc-btn" data-action="new">Create New World</button>
      </div>
    </div>
    <div class="menu-footer left">Voxel World — built with Three.js</div>
    <div class="menu-footer right" data-role="seed"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>

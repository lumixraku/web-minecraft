<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Voxel World</title>
  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden;
      background: #a4d5f3;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: #fff;
    }
    #app { width: 100vw; height: 100vh; display: block; }

    /* HUD: only visible when world is loaded and menu hidden */
    #hud {
      position: fixed; bottom: 16px; left: 16px;
      color: #fff; background: rgba(0, 0, 0, 0.4);
      padding: 8px 12px; border-radius: 6px;
      font-size: 12px; line-height: 1.6;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
    }
    body.menu-open #hud { display: none; }

    /* Loading splash */
    #loading {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: linear-gradient(180deg, #4ea3e8 0%, #a4d5f3 60%, #eaf3fb 100%);
      color: #fff; font-size: 18px; z-index: 200;
      letter-spacing: 2px;
    }

    /* ---------- Menu ---------- */
    #menu {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(180deg, rgba(20, 40, 70, 0.55) 0%, rgba(20, 40, 70, 0.25) 100%);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: opacity 0.2s ease;
    }
    #menu.hidden { display: none; }

    .menu-title {
      font-size: 88px;
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #f7faff;
      line-height: 0.9;
      text-shadow:
        3px 3px 0 #1a2c4a,
        6px 6px 0 #0e1a30,
        8px 8px 24px rgba(0, 0, 0, 0.5);
      margin: 0;
    }
    .menu-subtitle {
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.75;
      margin-top: 14px;
      margin-bottom: 56px;
      color: #cfe4ff;
    }
    .menu-buttons {
      display: flex; flex-direction: column;
      gap: 10px; width: 320px;
    }
    .menu-btn {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 14px 24px;
      background: rgba(255, 255, 255, 0.10);
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.32);
      border-radius: 4px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .menu-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.6);
      transform: translateY(-1px);
    }
    .menu-btn:active:not(:disabled) {
      transform: translateY(0);
      background: rgba(255, 255, 255, 0.30);
    }
    .menu-btn:disabled {
      opacity: 0.35; cursor: not-allowed;
    }
    .menu-btn .label {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
    }
    .menu-btn .hint {
      font-size: 11px;
      opacity: 0.7;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .menu-footer {
      position: absolute; bottom: 24px;
      font-size: 11px; opacity: 0.5;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .menu-seed {
      position: absolute; top: 24px; left: 24px;
      font-size: 11px; opacity: 0.55;
      letter-spacing: 1px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/dist/esm/simplex-noise.js"
    }
  }
  </script>
</head>
<body class="menu-open">
  <canvas id="app"></canvas>

  <div id="hud">
    Drag to rotate · Scroll to zoom · Right-drag to pan · ESC for menu
  </div>

  <div id="loading">Generating terrain…</div>

  <div id="menu">
    <div class="menu-seed" data-role="seed"></div>
    <h1 class="menu-title">Voxel World</h1>
    <div class="menu-subtitle">Procedural Mountains &amp; Lakes</div>
    <div class="menu-buttons">
      <button class="menu-btn" data-action="continue">
        <span class="label">Continue</span>
        <span class="hint">No saved world yet</span>
      </button>
      <button class="menu-btn" data-action="new">
        <span class="label">Create New World</span>
        <span class="hint">Roll a fresh terrain</span>
      </button>
    </div>
    <div class="menu-footer">ESC to toggle</div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
